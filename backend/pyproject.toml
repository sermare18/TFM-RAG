[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-cliente"
version = "0.1.0"
description = "Base code for a local Python RAG using Marker, LangChain text splitters, LanceDB, and OpenAI-compatible local LLM endpoints."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "torch==2.12.1",
  "lancedb>=0.17.0",
  "langchain-text-splitters>=0.3.0",
  "marker-pdf>=1.10.2",
  "numpy>=1.26.0",
  "openai>=1.40.0",
  "pyarrow>=18.0.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "pymupdf>=1.24.0",
  "python-docx>=1.1.2",
  "python-dotenv>=1.0.1",
  "python-multipart>=0.0.9",
  "uvicorn>=0.32.0",
  "streamlit>=1.44.0",
  "rank-bm25>=0.2.2",
]

[project.scripts]
rag-cli = "rag_cliente.cli:main"
rag-api = "rag_cliente.api:run"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
