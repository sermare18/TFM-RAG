[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-cliente"
version = "0.1.0"
description = "Hybrid RAG with Bedrock document-to-Markdown ingestion and local embedding/chat models."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "boto3>=1.35.0,<2.0.0",
  "fastapi>=0.115.0",
  "httpx>=0.27.0,<1.0.0",
  "huggingface-hub>=0.27.0,<2.0.0",
  "lancedb>=0.17.0",
  "openai>=2.2.0,<3.0.0",
  "pyarrow>=18.0.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "pymupdf>=1.24.0",
  "python-dotenv>=1.0.1",
  "python-multipart>=0.0.9",
  "uvicorn>=0.32.0",
  "streamlit>=1.44.0",
  "rank-bm25>=0.2.2",
]

[project.scripts]
rag-cli = "rag_cliente.cli:main"
rag-api = "rag_cliente.api:run"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
